name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: "off"
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --compatibility pypi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*

  build-android:
    name: Build Android ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            android_tag: android_24_arm64_v8a
            pydroid_tag: linux_aarch64
          - target: x86_64-linux-android
            android_tag: android_24_x86_64
            pydroid_tag: linux_x86_64
    env:
      ANDROID_API_LEVEL: "24"
      ANDROID_PYTHON_VERSION: "3.13.15"
    steps:
      - uses: actions/checkout@v4
      - name: Build Android wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "off"
          args: --release --out dist --compatibility pypi
      - name: Add Pydroid-compatible wheel tag
        shell: bash
        env:
          ANDROID_TAG: ${{ matrix.android_tag }}
          PYDROID_TAG: ${{ matrix.pydroid_tag }}
        run: |
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import os
          import pathlib
          import zipfile

          dist = pathlib.Path("dist")
          android_tag = os.environ["ANDROID_TAG"]
          pydroid_tag = os.environ["PYDROID_TAG"]

          src = next(dist.glob(f"*-{android_tag}.whl"))
          dst = src.with_name(src.name.replace(android_tag, pydroid_tag))

          with zipfile.ZipFile(src, "r") as zin:
              files = {name: zin.read(name) for name in zin.namelist()}

          wheel_path = next(name for name in files if name.endswith(".dist-info/WHEEL"))
          record_path = next(name for name in files if name.endswith(".dist-info/RECORD"))

          wheel_text = files[wheel_path].decode("utf-8")
          old_tag = f"cp310-abi3-{android_tag}"
          new_tag = f"cp310-abi3-{pydroid_tag}"
          if old_tag not in wheel_text:
              raise SystemExit(f"wheel tag not found: {old_tag}")
          files[wheel_path] = wheel_text.replace(old_tag, new_tag).encode("utf-8")

          rows = []
          for name, data in files.items():
              if name == record_path:
                  continue
              digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode("ascii")
              rows.append([name, f"sha256={digest}", str(len(data))])
          rows.append([record_path, "", ""])

          buf = io.StringIO(newline="")
          csv.writer(buf, lineterminator="\n").writerows(rows)
          files[record_path] = buf.getvalue().encode("utf-8")

          with zipfile.ZipFile(dst, "w", compression=zipfile.ZIP_DEFLATED) as zout:
              for name, data in files.items():
                  zout.writestr(name, data)

          print(dst)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-android-${{ matrix.target }}
          path: dist/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: python -m pip install --upgrade pip maturin
      - name: Check Rust
        run: cargo check --all-targets
      - name: Run Rust tests
        run: cargo test --lib
      - name: Build sdist
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build-desktop, build-android, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
