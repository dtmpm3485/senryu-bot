name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: "off"
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --compatibility pypi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*

  build-android:
    name: Build Android ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
    env:
      ANDROID_API_LEVEL: "24"
      ANDROID_PYTHON_VERSION: "3.13.15"
    steps:
      - uses: actions/checkout@v4
      - name: Build Android wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "off"
          args: --release --out dist --compatibility pypi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-android-${{ matrix.target }}
          path: dist/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: python -m pip install --upgrade pip maturin
      - name: Check Rust
        run: cargo check --all-targets
      - name: Run Rust tests
        run: cargo test --lib
      - name: Build sdist
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build-desktop, build-android, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
