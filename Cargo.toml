[package]
name = "senryu-bot-native"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Rust core for the senryu-bot Python package"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
lindera = { version = "6.0.0", features = ["embed-unidic"] }
once_cell = "1"
parking_lot = "0.12"
pyo3 = { version = "0.27.1", features = ["abi3-py310"] }
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serenity = { version = "0.12.5", default-features = false, features = [
  "builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "utils"
] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "sqlite", "postgres"
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "time", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1"
