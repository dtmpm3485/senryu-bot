[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "senryu-bot"
version = "0.1.3"
description = "A Rust-powered Discord senryu detector bot, launched from Python with one function call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "senryu-bot contributors" }
]
keywords = ["discord", "senryu", "haiku", "japanese", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Communications :: Chat",
]
dependencies = []

[tool.maturin]
python-source = "python"
module-name = "senryu_bot._native"
features = ["pyo3/extension-module"]
strip = true

[project.urls]
Homepage = "https://github.com/dtmpm3485/senryu-bot"
Repository = "https://github.com/dtmpm3485/senryu-bot"
Issues = "https://github.com/dtmpm3485/senryu-bot/issues"
