# `run("TOKEN")` works without this file.
# Create `senryu_bot.toml` only when you want advanced settings.

[discord]
playing = ""
welcome_enabled = true

[database]
driver = "sqlite3"
path = "data/senryu.db"
# dsn = "postgres://user:password@localhost/findsenryu"

[log]
level = "info"
format = "text"

[admin]
owner_ids = []
guild_id = ""
log_channel_id = ""
report_channel_id = ""
contact_channel_id = ""

[server]
enabled = true
host = "127.0.0.1"
port = 9090

[backup]
enabled = false
interval_hour = 24
path = "data/backups"
max_backups = 7

[encryption]
# key = ""
